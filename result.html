<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            font-size: 22px;
            border-radius: 6px;
        }
        img {
            width: 300px;
            margin: 20px 0;
            border-radius: 6px;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        Prediction Result
    </div>

    <h3>Predicted Class: {{ prediction }}</h3>

    <img src="{{ url_for('static', filename=img_path) }}">

    <br>
    <a href="/" class="btn">Upload Another Image</a>
</div>

</body>
</html>
