<!DOCTYPE html>
<html>
<head>
    <title>Blood Cell Classification</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #e74c3c;
            color: white;
            padding: 12px;
            font-size: 22px;
            border-radius: 6px;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        Blood Cell Classification
    </div>

    <br>

    <!-- 🔥 IMPORTANT: action="/predict" and method="post" -->
    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="image" required><br><br>
        <button type="submit" class="btn">Predict</button>
    </form>
</div>

</body>
</html>
